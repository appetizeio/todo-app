name: Attach APK to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs because the org requires it
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # pinned so a runner image change cannot quietly move the build
      - name: Install SDK packages
        run: |
          # sdkmanager is not on PATH on hosted runners
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build universal release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name it after the tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "todo-app-${GITHUB_REF_NAME}.apk"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "todo-app-${GITHUB_REF_NAME}.apk" --clobber
