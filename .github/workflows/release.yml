name: Attach APK to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # pinned so a runner image change cannot quietly move the build
      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build universal release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name it after the tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "todo-app-${GITHUB_REF_NAME}.apk"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "todo-app-${GITHUB_REF_NAME}.apk" --clobber
